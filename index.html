<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>☠️ 薬物ダメ絶対マップ ☠️</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body{margin:0;font-family:sans-serif}
h1{text-align:center;font-size:20px;margin:10px 0 3px}
.sub{text-align:center;font-size:12px;margin-bottom:5px}
#map{height:calc(100vh - 65px)}
</style>
</head>

<body>

<h1>☠️ 薬物ダメ絶対マップ ☠️</h1>
<div class="sub">削除依頼はこちら → URL</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const config = JSON.parse(
  localStorage.getItem("drugMapConfig") || "null"
);

if (!config) {
  location.href = "setup.html";
} else {

  const supabaseClient =
    supabase.createClient(config.url, config.key);

  const map = L.map("map").setView([34.7,135.5],9);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:"© OpenStreetMap"
    }
  ).addTo(map);

  supabaseClient
    .from("map_spots")
    .select("*")
    .then(({data,error}) => {

      if(error){
        alert(error.message);
        return;
      }

      (data || []).forEach(spot => {

        L.marker([
          spot.latitude,
          spot.longitude
        ])
        .addTo(map)
        .bindPopup(
          "<b>" +
          escapeHtml(spot.building_name || "") +
          "</b><br>" +
          escapeHtml(spot.explanation || "")
        );

      });

    });
}

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g,function(c){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c];
  });
}
</script>

</body>
</html>
