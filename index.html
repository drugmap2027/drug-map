<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ダメゼッタイマップ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .delete-link {
      text-align: center;
      margin-bottom: 10px;
    }

    .delete-link a {
      display: inline-block;
      padding: 8px 16px;
      background: #333;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    #map {
      height: 80vh;
    }
  </style>
</head>

<body>

  <h1>ダメゼッタイマップ</h1>

  <div class="delete-link">
    <a
      href="https://signal.me/#eu/oWFpw_T5syPhiVMBTOz9zco5PhBHzUPZzRTmnMXBP0kro6RGx9hOq4bf9iU5WYoM"
      target="_blank"
      rel="noopener noreferrer"
    >
      URL
    </a>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL = "https://mlutpkvjhlbotiqfkrya.supabase.co";
    const SUPABASE_KEY = "sb_publishable_hZ9yJ9ws29oWYSM8y_OJYA_319N7pVc";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const map = L.map('map').setView(
      [35.6812, 139.7671],
      5
    );

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);

    async function loadFacilities() {

      const { data, error } =
        await supabaseClient
          .from('facilities')
          .select('*');

      if (error) {
        console.error(error);
        return;
      }

      data.forEach(facility => {

        const marker = L.marker([
          facility.latitude,
          facility.longitude
        ]).addTo(map);

        marker.bindPopup(`
          <strong>${facility.building_name}</strong><br><br>

          <b>住所：</b>${facility.address || ''}<br>
          <b>名前：</b>${facility.name || ''}<br>
          <b>電話番号：</b>${facility.phone || ''}<br>
          <b>ID：</b>${facility.facility_id || ''}<br>
          <b>説明：</b>${facility.description || ''}
        `);

      });
    }

    loadFacilities();

  </script>

</body>
</html>
