<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ダメゼッタイマップ 管理画面</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
    }

    h2 {
      margin-top: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .logout {
      background: #777;
    }

    .edit {
      background: #1976d2;
    }

    .delete {
      background: #d32f2f;
    }

    .cancel {
      background: #777;
    }

    .facility {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    .facility strong {
      font-size: 18px;
    }

    .message {
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      background: #eee;
    }

    #admin {
      display: none;
    }

    #editArea {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>ダメゼッタイマップ<br>管理画面</h1>


  <!-- ログイン画面 -->

  <div id="login" class="card">

    <h2>管理者ログイン</h2>

    <label>メールアドレス</label>

    <input
      type="email"
      id="email"
      placeholder="メールアドレス"
    >

    <label>パスワード</label>

    <input
      type="password"
      id="password"
      placeholder="パスワード"
    >

    <button onclick="login()">
      ログイン
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- 管理画面 -->

  <div id="admin">

    <div class="card">

      <p>
        管理者としてログインしています。
      </p>

      <button
        class="logout"
        onclick="logout()"
      >
        ログアウト
      </button>

    </div>


    <!-- 施設追加 -->

    <div class="card">

      <h2>施設を追加</h2>

      <label>建物名</label>

      <input
        type="text"
        id="building_name"
        placeholder="例：架空ダルク大阪"
      >


      <label>住所</label>

      <input
        type="text"
        id="address"
        placeholder="例：大阪府架空市テスト町1-1-1"
      >


      <label>名前</label>

      <input
        type="text"
        id="name"
        placeholder="例：架空 太郎"
      >


      <label>電話番号</label>

      <input
        type="text"
        id="phone"
        placeholder="例：000-0000-0000"
      >


      <label>各種ID</label>

      <input
        type="text"
        id="facility_id"
        placeholder="例：TEST-001"
      >


      <label>説明</label>

      <textarea
        id="description"
        placeholder="施設についての説明"
      ></textarea>


      <button onclick="addFacility()">
        施設を登録
      </button>

      <div id="addMessage"></div>

    </div>


    <!-- 編集 -->

    <div
      id="editArea"
      class="card"
    >

      <h2>施設を編集</h2>

      <input
        type="hidden"
        id="edit_id"
      >


      <label>建物名</label>

      <input
        type="text"
        id="edit_building_name"
      >


      <label>住所</label>

      <input
        type="text"
        id="edit_address"
      >


      <label>名前</label>

      <input
        type="text"
        id="edit_name"
      >


      <label>電話番号</label>

      <input
        type="text"
        id="edit_phone"
      >


      <label>各種ID</label>

      <input
        type="text"
        id="edit_facility_id"
      >


      <label>説明</label>

      <textarea
        id="edit_description"
      ></textarea>


      <button
        class="edit"
        onclick="saveEdit()"
      >
        変更を保存
      </button>


      <button
        class="cancel"
        onclick="cancelEdit()"
      >
        キャンセル
      </button>

    </div>


    <!-- 施設一覧 -->

    <div class="card">

      <h2>登録済み施設</h2>

      <div id="facilityList">
        読み込み中...
      </div>

    </div>

  </div>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  const SUPABASE_URL =
    "https://mlutpkvjhlbotiqfkrya.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_hZ9yJ9ws29oWYSM8y_OJYA_319N7pVc";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================
  // ログイン
  // =========================

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      document.getElementById(
        "loginMessage"
      ).textContent =
        "ログインできませんでした。";

      console.error(error);

      return;
    }


    showAdmin();

  }


  // =========================
  // ログイン状態確認
  // =========================

  async function checkLogin() {

    const { data } =
      await supabaseClient.auth.getUser();


    if (data.user) {

      showAdmin();

    }

  }


  // =========================
  // 管理画面表示
  // =========================

  function showAdmin() {

    document.getElementById(
      "login"
    ).style.display = "none";


    document.getElementById(
      "admin"
    ).style.display = "block";


    loadFacilities();

  }


  // =========================
  // ログアウト
  // =========================

  async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

  }


  // =========================
  // 施設追加
  // =========================

  async function addFacility() {

    const building_name =
      document.getElementById(
        "building_name"
      ).value.trim();


    const address =
      document.getElementById(
        "address"
      ).value.trim();


    const name =
      document.getElementById(
        "name"
      ).value.trim();


    const phone =
      document.getElementById(
        "phone"
      ).value.trim();


    const facility_id =
      document.getElementById(
        "facility_id"
      ).value.trim();


    const description =
      document.getElementById(
        "description"
      ).value.trim();


    if (!building_name) {

      alert("建物名を入力してください。");

      return;

    }


    const { error } =
      await supabaseClient
        .from("facilities")
        .insert({
          building_name,
          address,
          name,
          phone,
          facility_id,
          description
        });


    if (error) {

      alert(
        "登録に失敗しました。\n" +
        error.message
      );

      console.error(error);

      return;
    }


    alert("施設を登録しました。");


    document.getElementById(
      "building_name"
    ).value = "";


    document.getElementById(
      "address"
    ).value = "";


    document.getElementById(
      "name"
    ).value = "";


    document.getElementById(
      "phone"
    ).value = "";


    document.getElementById(
      "facility_id"
    ).value = "";


    document.getElementById(
      "description"
    ).value = "";


    loadFacilities();

  }


  // =========================
  // 施設一覧
  // =========================

  async function loadFacilities() {

    const list =
      document.getElementById(
        "facilityList"
      );


    const { data, error } =
      await supabaseClient
        .from("facilities")
        .select("*")
        .order("id", {
          ascending: false
        });


    if (error) {

      list.innerHTML =
        "読み込みに失敗しました。";

      console.error(error);

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML =
        "登録されている施設はありません。";

      return;

    }


    list.innerHTML = "";


    data.forEach(facility => {

      const div =
        document.createElement("div");


      div.className = "facility";


      div.innerHTML = `

        <strong>
          ${escapeHtml(
            facility.building_name || ""
          )}
        </strong>

        <p>
          <b>住所：</b>
          ${escapeHtml(
            facility.address || ""
          )}
        </p>

        <p>
          <b>名前：</b>
          ${escapeHtml(
            facility.name || ""
          )}
        </p>

        <p>
          <b>電話番号：</b>
          ${escapeHtml(
            facility.phone || ""
          )}
        </p>

        <p>
          <b>ID：</b>
          ${escapeHtml(
            facility.facility_id || ""
          )}
        </p>

        <p>
          <b>説明：</b>
          ${escapeHtml(
            facility.description || ""
          )}
        </p>

        <button
          class="edit"
          onclick="startEdit(${facility.id})"
        >
          編集
        </button>

        <button
          class="delete"
          onclick="deleteFacility(${facility.id})"
        >
          削除
        </button>

      `;


      list.appendChild(div);

    });

  }


  // =========================
  // 編集開始
  // =========================

  async function startEdit(id) {

    const { data, error } =
      await supabaseClient
        .from("facilities")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {

      alert(
        "施設情報を取得できませんでした。"
      );

      return;
    }


    document.getElementById(
      "edit_id"
    ).value = data.id;


    document.getElementById(
      "edit_building_name"
    ).value =
      data.building_name || "";


    document.getElementById(
      "edit_address"
    ).value =
      data.address || "";


    document.getElementById(
      "edit_name"
    ).value =
      data.name || "";


    document.getElementById(
      "edit_phone"
    ).value =
      data.phone || "";


    document.getElementById(
      "edit_facility_id"
    ).value =
      data.facility_id || "";


    document.getElementById(
      "edit_description"
    ).value =
      data.description || "";


    document.getElementById(
      "editArea"
    ).style.display = "block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  // =========================
  // 編集保存
  // =========================

  async function saveEdit() {

    const id =
      document.getElementById(
        "edit_id"
      ).value;


    const building_name =
      document.getElementById(
        "edit_building_name"
      ).value.trim();


    const address =
      document.getElementById(
        "edit_address"
      ).value.trim();


    const name =
      document.getElementById(
        "edit_name"
      ).value.trim();


    const phone =
      document.getElementById(
        "edit_phone"
      ).value.trim();


    const facility_id =
      document.getElementById(
        "edit_facility_id"
      ).value.trim();


    const description =
      document.getElementById(
        "edit_description"
      ).value.trim();


    const { error } =
      await supabaseClient
        .from("facilities")
        .update({
          building_name,
          address,
          name,
          phone,
          facility_id,
          description
        })
        .eq("id", id);


    if (error) {

      alert(
        "更新に失敗しました。\n" +
        error.message
      );

      console.error(error);

      return;
    }


    alert("変更しました。");


    cancelEdit();

    loadFacilities();

  }


  // =========================
  // 編集キャンセル
  // =========================

  function cancelEdit() {

    document.getElementById(
      "editArea"
    ).style.display = "none";

  }


  // =========================
  // 削除
  // =========================

  async function deleteFacility(id) {

    const ok =
      confirm(
        "この施設を削除しますか？\n\nこの操作は元に戻せません。"
      );


    if (!ok) {

      return;

    }


    const { error } =
      await supabaseClient
        .from("facilities")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "削除に失敗しました。\n" +
        error.message
      );

      console.error(error);

      return;
    }


    alert("削除しました。");


    loadFacilities();

  }


  // =========================
  // HTMLエスケープ
  // =========================

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  // =========================
  // 起動時
  // =========================

  checkLogin();

</script>

</body>
</html>
