<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ダメゼッタイマップ 管理画面</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    input,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      border-radius: 6px;
    }

    #admin {
      display: none;
    }
  </style>
</head>

<body>

  <h1>ダメゼッタイマップ<br>管理画面</h1>

  <div id="login">

    <h2>管理者ログイン</h2>

    <label>メールアドレス</label>
    <input
      type="email"
      id="email"
      placeholder="メールアドレス"
    >

    <label>パスワード</label>
    <input
      type="password"
      id="password"
      placeholder="パスワード"
    >

    <button onclick="login()">
      ログイン
    </button>

    <p id="message"></p>

  </div>


  <div id="admin">

    <h2>施設管理</h2>

    <p>管理者としてログインしています。</p>

    <button onclick="logout()">
      ログアウト
    </button>

    <hr>

    <h3>施設を追加</h3>

    <label>建物名</label>
    <input id="building_name">

    <label>住所</label>
    <input id="address">

    <label>名前</label>
    <input id="name">

    <label>電話番号</label>
    <input id="phone">

    <label>各種ID</label>
    <input id="facility_id">

    <label>説明</label>
    <textarea id="description"></textarea>

    <button onclick="addFacility()">
      施設を登録
    </button>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://mlutpkvjhlbotiqfkrya.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_hZ9yJ9ws29oWYSM8y_OJYA_319N7pVc";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function login() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        document.getElementById("message").textContent =
          "ログインできませんでした。";

        console.error(error);

        return;
      }


      document.getElementById("login").style.display =
        "none";

      document.getElementById("admin").style.display =
        "block";
    }


    async function logout() {

      await supabaseClient.auth.signOut();

      location.reload();
    }


    async function addFacility() {

      const building_name =
        document.getElementById("building_name").value;

      const address =
        document.getElementById("address").value;

      const name =
        document.getElementById("name").value;

      const phone =
        document.getElementById("phone").value;

      const facility_id =
        document.getElementById("facility_id").value;

      const description =
        document.getElementById("description").value;


      const { error } =
        await supabaseClient
          .from("facilities")
          .insert({
            building_name,
            address,
            name,
            phone,
            facility_id,
            description
          });


      if (error) {

        alert(
          "登録に失敗しました。\n" +
          error.message
        );

        return;
      }


      alert("施設を登録しました。");
    }

  </script>

</body>
</html>
