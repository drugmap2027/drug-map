<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ダメゼッタイマップ 管理画面</title>


  <!-- Leaflet -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #f5f5f5;
      color: #222;
    }


    .container {
      max-width: 750px;
      margin: 0 auto;
    }


    h1 {
      text-align: center;
      margin-bottom: 25px;
    }


    h2 {
      margin-top: 0;
    }


    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }


    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }


    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }


    textarea {
      min-height: 110px;
      resize: vertical;
    }


    button {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }


    button:hover {
      opacity: 0.85;
    }


    .search-row {
      display: flex;
      gap: 8px;
      align-items: end;
    }


    .search-row input {
      flex: 1;
    }


    .search-row button {
      width: 110px;
      margin-top: 6px;
    }


    .logout {
      background: #777;
    }


    .edit {
      background: #1976d2;
    }


    .delete {
      background: #d32f2f;
    }


    .cancel {
      background: #777;
    }


    #map {
      width: 100%;
      height: 350px;
      margin-top: 15px;
      border-radius: 8px;
      overflow: hidden;
    }


    .map-help {
      margin-top: 10px;
      color: #555;
      font-size: 14px;
    }


    .facility {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }


    .facility strong {
      font-size: 18px;
    }


    .facility p {
      margin: 7px 0;
    }


    #admin {
      display: none;
    }


    #editArea {
      display: none;
    }


    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      background: #eee;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    ダメゼッタイマップ<br>
    管理画面
  </h1>


  <!-- =========================
       ログイン
  ========================== -->

  <div
    id="login"
    class="card"
  >

    <h2>管理者ログイン</h2>


    <label>
      メールアドレス
    </label>

    <input
      type="email"
      id="email"
      placeholder="メールアドレス"
    >


    <label>
      パスワード
    </label>

    <input
      type="password"
      id="password"
      placeholder="パスワード"
    >


    <button
      onclick="login()"
    >
      ログイン
    </button>


    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>



  <!-- =========================
       管理画面
  ========================== -->

  <div id="admin">


    <!-- ログアウト -->

    <div class="card">

      <p>
        管理者としてログインしています。
      </p>


      <button
        class="logout"
        onclick="logout()"
      >
        ログアウト
      </button>

    </div>



    <!-- =========================
         新規施設
    ========================== -->

    <div class="card">

      <h2>
        施設を追加
      </h2>


      <label>
        建物名
      </label>

      <input
        type="text"
        id="building_name"
        placeholder="例：架空ダルク大阪"
      >



      <label>
        郵便番号
      </label>


      <div class="search-row">

        <input
          type="text"
          id="postal_code"
          placeholder="例：530-0001"
          inputmode="numeric"
        >


        <button
          type="button"
          onclick="searchPostalCode()"
        >
          検索
        </button>

      </div>


      <div
        id="postalMessage"
        class="message"
      ></div>



      <label>
        住所
      </label>

      <input
        type="text"
        id="address"
        placeholder="住所"
      >



      <div id="map"></div>


      <p class="map-help">
        📍 ピンを指でドラッグして、登録したい場所に移動してください。
      </p>



      <label>
        名前
      </label>

      <input
        type="text"
        id="name"
        placeholder="名前"
      >



      <label>
        電話番号
      </label>

      <input
        type="text"
        id="phone"
        placeholder="電話番号"
        inputmode="tel"
      >



      <label>
        各種ID
      </label>

      <input
        type="text"
        id="facility_id"
        placeholder="例：TEST-001"
      >



      <label>
        説明
      </label>

      <textarea
        id="description"
        placeholder="施設についての説明"
      ></textarea>



      <button
        onclick="addFacility()"
      >
        この位置で施設を登録
      </button>


      <div
        id="addMessage"
        class="message"
      ></div>

    </div>



    <!-- =========================
         編集
    ========================== -->

    <div
      id="editArea"
      class="card"
    >

      <h2>
        施設を編集
      </h2>


      <input
        type="hidden"
        id="edit_id"
      >


      <label>
        建物名
      </label>

      <input
        type="text"
        id="edit_building_name"
      >



      <label>
        郵便番号
      </label>

      <div class="search-row">

        <input
          type="text"
          id="edit_postal_code"
        >


        <button
          type="button"
          onclick="searchEditPostalCode()"
        >
          検索
        </button>

      </div>



      <label>
        住所
      </label>

      <input
        type="text"
        id="edit_address"
      >



      <div id="editMap"></div>


      <p class="map-help">
        📍 ピンをドラッグして位置を変更できます。
      </p>



      <label>
        名前
      </label>

      <input
        type="text"
        id="edit_name"
      >



      <label>
        電話番号
      </label>

      <input
        type="text"
        id="edit_phone"
      >



      <label>
        各種ID
      </label>

      <input
        type="text"
        id="edit_facility_id"
      >



      <label>
        説明
      </label>

      <textarea
        id="edit_description"
      ></textarea>



      <button
        class="edit"
        onclick="saveEdit()"
      >
        変更を保存
      </button>


      <button
        class="cancel"
        onclick="cancelEdit()"
      >
        キャンセル
      </button>

    </div>



    <!-- =========================
         施設一覧
    ========================== -->

    <div class="card">

      <h2>
        登録済み施設
      </h2>


      <div id="facilityList">
        読み込み中...
      </div>

    </div>


  </div>

</div>



<!-- Leaflet -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>



<!-- Supabase -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>



<script>


  // =========================
  // Supabase設定
  // =========================

  const SUPABASE_URL =
    "https://mlutpkvjhlbotiqfkrya.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_hZ9yJ9ws29oWYSM8y_OJYA_319N7pVc";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );



  // =========================
  // 新規登録用の地図
  // =========================

  const map =
    L.map("map").setView(
      [35.6812, 139.7671],
      5
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);



  let marker =
    L.marker(
      [35.6812, 139.7671],
      {
        draggable: true
      }
    ).addTo(map);



  // =========================
  // 編集用地図
  // =========================

  const editMap =
    L.map("editMap").setView(
      [35.6812, 139.7671],
      5
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(editMap);


  let editMarker =
    L.marker(
      [35.6812, 139.7671],
      {
        draggable: true
      }
    ).addTo(editMap);



  // =========================
  // ログイン
  // =========================

  async function login() {

    const email =
      document.getElementById(
        "email"
      ).value.trim();


    const password =
      document.getElementById(
        "password"
      ).value;


    const {
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword({
          email,
          password
        });


    if (error) {

      document.getElementById(
        "loginMessage"
      ).textContent =
        "ログインできませんでした。";

      console.error(error);

      return;

    }


    showAdmin();

  }



  // =========================
  // ログイン確認
  // =========================

  async function checkLogin() {

    const {
      data
    } =
      await supabaseClient
        .auth
        .getUser();


    if (data.user) {

      showAdmin();

    }

  }



  // =========================
  // 管理画面表示
  // =========================

  function showAdmin() {

    document.getElementById(
      "login"
    ).style.display =
      "none";


    document.getElementById(
      "admin"
    ).style.display =
      "block";


    setTimeout(
      () => {

        map.invalidateSize();

        editMap.invalidateSize();

      },
      300
    );


    loadFacilities();

  }



  // =========================
  // ログアウト
  // =========================

  async function logout() {

    await supabaseClient
      .auth
      .signOut();


    location.reload();

  }



  // =========================
  // 郵便番号検索
  // =========================

  async function searchPostalCode() {

    const input =
      document.getElementById(
        "postal_code"
      );


    const message =
      document.getElementById(
        "postalMessage"
      );


    const postal =
      input.value
        .replace(/[^0-9]/g, "");


    if (
      postal.length !== 7
    ) {

      message.textContent =
        "郵便番号は7桁で入力してください。";

      return;

    }


    message.textContent =
      "検索しています...";


    try {

      const response =
        await fetch(
          "https://zipcloud.ibsnet.co.jp/api/search?" +
          new URLSearchParams({
            zipcode: postal
          })
        );


      const result =
        await response.json();


      if (
        !result.results ||
        !result.results.length
      ) {

        message.textContent =
          "郵便番号が見つかりませんでした。";

        return;

      }


      const r =
        result.results[0];


      const address =
        r.address1 +
        r.address2 +
        r.address3;


      document.getElementById(
        "address"
      ).value =
        address;


      /*
       * 郵便番号で取得した住所を
       * OpenStreetMapで検索
       */

      const geoResponse =
        await fetch(
          "https://nominatim.openstreetmap.org/search?" +
          new URLSearchParams({
            q: address,
            format: "json",
            limit: "1",
            countrycodes: "jp"
          })
        );


      const geo =
        await geoResponse.json();


      if (
        !geo.length
      ) {

        message.textContent =
          "住所は取得できましたが、地図上の位置を取得できませんでした。ピンを手動で移動してください。";

        return;

      }


      const lat =
        Number(geo[0].lat);


      const lon =
        Number(geo[0].lon);


      map.setView(
        [lat, lon],
        15
      );


      marker.setLatLng(
        [lat, lon]
      );


      message.textContent =
        "位置を移動しました。必要なら📍を指で動かしてください。";


    } catch (error) {

      console.error(error);


      message.textContent =
        "検索中にエラーが発生しました。";

    }

  }



  // =========================
  // 新規施設追加
  // =========================

  async function addFacility() {

    const building_name =
      document.getElementById(
        "building_name"
      ).value.trim();


    const postal_code =
      document.getElementById(
        "postal_code"
      ).value.trim();


    const address =
      document.getElementById(
        "address"
      ).value.trim();


    const name =
      document.getElementById(
        "name"
      ).value.trim();


    const phone =
      document.getElementById(
        "phone"
      ).value.trim();


    const facility_id =
      document.getElementById(
        "facility_id"
      ).value.trim();


    const description =
      document.getElementById(
        "description"
      ).value.trim();


    const position =
      marker.getLatLng();


    if (!building_name) {

      alert(
        "建物名を入力してください。"
      );

      return;

    }


    if (!address) {

      alert(
        "住所を入力してください。"
      );

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("facilities")
        .insert({

          building_name,

          postal_code,

          address,

          name,

          phone,

          facility_id,

          description,

          latitude:
            position.lat,

          longitude:
            position.lng

        });


    if (error) {

      alert(
        "登録に失敗しました。\n\n" +
        error.message
      );

      console.error(error);

      return;

    }


    alert(
      "施設を登録しました。"
    );


    clearForm();


    loadFacilities();

  }



  // =========================
  // 入力クリア
  // =========================

  function clearForm() {

    document.getElementById(
      "building_name"
    ).value = "";


    document.getElementById(
      "postal_code"
    ).value = "";


    document.getElementById(
      "address"
    ).value = "";


    document.getElementById(
      "name"
    ).value = "";


    document.getElementById(
      "phone"
    ).value = "";


    document.getElementById(
      "facility_id"
    ).value = "";


    document.getElementById(
      "description"
    ).value = "";


    document.getElementById(
      "postalMessage"
    ).textContent = "";

  }



  // =========================
  // 施設一覧
  // =========================

  async function loadFacilities() {

    const list =
      document.getElementById(
        "facilityList"
      );


    const {
      data,
      error
    } =
      await supabaseClient
        .from("facilities")
        .select("*")
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (error) {

      list.innerHTML =
        "読み込みに失敗しました。";

      console.error(error);

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      list.innerHTML =
        "登録されている施設はありません。";

      return;

    }


    list.innerHTML = "";


    data.forEach(
      facility => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "facility";


        div.innerHTML = `

          <strong>
            ${escapeHtml(
              facility.building_name
            )}
          </strong>

          <p>
            <b>郵便番号：</b>
            ${escapeHtml(
              facility.postal_code
            )}
          </p>

          <p>
            <b>住所：</b>
            ${escapeHtml(
              facility.address
            )}
          </p>

          <p>
            <b>名前：</b>
            ${escapeHtml(
              facility.name
            )}
          </p>

          <p>
            <b>電話番号：</b>
            ${escapeHtml(
              facility.phone
            )}
          </p>

          <p>
            <b>ID：</b>
            ${escapeHtml(
              facility.facility_id
            )}
          </p>

          <p>
            <b>説明：</b>
            ${escapeHtml(
              facility.description
            )}
          </p>

          <button
            class="edit"
            onclick="startEdit(${facility.id})"
          >
            編集
          </button>

          <button
            class="delete"
            onclick="deleteFacility(${facility.id})"
          >
            削除
          </button>

        `;


        list.appendChild(
          div
        );

      }
    );

  }



  // =========================
  // 編集開始
  // =========================

  async function startEdit(id) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("facilities")
        .select("*")
        .eq(
          "id",
          id
        )
        .single();


    if (error) {

      alert(
        "施設情報を取得できませんでした。"
      );

      return;

    }


    document.getElementById(
      "edit_id"
    ).value =
      data.id;


    document.getElementById(
      "edit_building_name"
    ).value =
      data.building_name || "";


    document.getElementById(
      "edit_postal_code"
    ).value =
      data.postal_code || "";


    document.getElementById(
      "edit_address"
    ).value =
      data.address || "";


    document.getElementById(
      "edit_name"
    ).value =
      data.name || "";


    document.getElementById(
      "edit_phone"
    ).value =
      data.phone || "";


    document.getElementById(
      "edit_facility_id"
    ).value =
      data.facility_id || "";


    document.getElementById(
      "edit_description"
    ).value =
      data.description || "";


    const lat =
      Number(
        data.latitude
      );


    const lng =
      Number(
        data.longitude
      );


    if (
      Number.isFinite(lat) &&
      Number.isFinite(lng)
    ) {

      editMap.setView(
        [lat, lng],
        15
      );


      editMarker.setLatLng(
        [lat, lng]
      );

    }


    document.getElementById(
      "editArea"
    ).style.display =
      "block";


    setTimeout(
      () => {
        editMap.invalidateSize();
      },
      300
    );


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }



  // =========================
  // 編集用郵便番号検索
  // =========================

  async function searchEditPostalCode() {

    const postal =
      document.getElementById(
        "edit_postal_code"
      ).value
        .replace(/[^0-9]/g, "");


    if (
      postal.length !== 7
    ) {

      alert(
        "郵便番号は7桁で入力してください。"
      );

      return;

    }


    try {

      const response =
        await fetch(
          "https://zipcloud.ibsnet.co.jp/api/search?" +
          new URLSearchParams({
            zipcode: postal
          })
        );


      const result =
        await response.json();


      if (
        !result.results ||
        !result.results.length
      ) {

        alert(
          "郵便番号が見つかりませんでした。"
        );

        return;

      }


      const r =
        result.results[0];


      const address =
        r.address1 +
        r.address2 +
        r.address3;


      document.getElementById(
        "edit_address"
      ).value =
        address;


      const geoResponse =
        await fetch(
          "https://nominatim.openstreetmap.org/search?" +
          new URLSearchParams({
            q: address,
            format: "json",
            limit: "1",
            countrycodes: "jp"
          })
        );


      const geo =
        await geoResponse.json();


      if (
        !geo.length
      ) {

        alert(
          "住所は取得できましたが、地図位置は取得できませんでした。ピンを手動で移動してください。"
        );

        return;

      }


      const lat =
        Number(
          geo[0].lat
        );


      const lon =
        Number(
          geo[0].lon
        );


      editMap.setView(
        [lat, lon],
        15
      );


      editMarker.setLatLng(
        [lat, lon]
      );


    } catch (error) {

      console.error(error);

      alert(
        "検索中にエラーが発生しました。"
      );

    }

  }



  // =========================
  // 編集保存
  // =========================

  async function saveEdit() {

    const id =
      document.getElementById(
        "edit_id"
      ).value;


    const building_name =
      document.getElementById(
        "edit_building_name"
      ).value.trim();


    const postal_code =
      document.getElementById(
        "edit_postal_code"
      ).value.trim();


    const address =
      document.getElementById(
        "edit_address"
      ).value.trim();


    const name =
      document.getElementById(
        "edit_name"
      ).value.trim();


    const phone =
      document.getElementById(
        "edit_phone"
      ).value.trim();


    const facility_id =
      document.getElementById(
        "edit_facility_id"
      ).value.trim();


    const description =
      document.getElementById(
        "edit_description"
      ).value.trim();


    const position =
      editMarker.getLatLng();


    const {
      error
    } =
      await supabaseClient
        .from("facilities")
        .update({

          building_name,

          postal_code,

          address,

          name,

          phone,

          facility_id,

          description,

          latitude:
            position.lat,

          longitude:
            position.lng

        })
        .eq(
          "id",
          id
        );


    if (error) {

      alert(
        "更新に失敗しました。\n\n" +
        error.message
      );

      console.error(error);

      return;

    }


    alert(
      "変更しました。"
    );


    cancelEdit();


    loadFacilities();

  }



  // =========================
  // 編集キャンセル
  // =========================

  function cancelEdit() {

    document.getElementById(
      "editArea"
    ).style.display =
      "none";

  }



  // =========================
  // 削除
  // =========================

  async function deleteFacility(id) {

    const ok =
      confirm(
        "この施設を削除しますか？\n\nこの操作は元に戻せません。"
      );


    if (!ok) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("facilities")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      alert(
        "削除に失敗しました。\n\n" +
        error.message
      );

      console.error(error);

      return;

    }


    alert(
      "削除しました。"
    );


    loadFacilities();

  }



  // =========================
  // HTMLエスケープ
  // =========================

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }



  // =========================
  // 起動
  // =========================

  checkLogin();

</script>
